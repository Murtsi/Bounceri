name: Feature request
description: Something we should build
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is hurting and why?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Smallest version that solves it.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Must have (demo breaks without it)
        - Should have (judges notice)
        - Nice to have
      default: 2
