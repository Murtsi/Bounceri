name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run repository checks
        run: bash scripts/check.sh

  changelog:
    name: Changelog updated
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG.md entry (see AGENTS.md)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          bash scripts/check-changelog.sh "$BASE" "$HEAD"

  compose:
    name: Compose config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  tests:
    name: Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install uv==0.11.26
          uv sync --frozen
      - name: Run all team tests
        run: uv run --no-sync pytest tests -q
      - name: Python lint
        run: uv run --no-sync ruff check src tests notebooks tools/hostinger

  frontend:
    name: Frontend build and unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frozen frontend dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Test and build existing dashboard plus investigations
        run: |
          corepack pnpm test
          corepack pnpm run build
